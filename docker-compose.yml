version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: midespacho_postgres
    environment:
      POSTGRES_USER: midespacho_user
      POSTGRES_PASSWORD: midespacho_pass_2026
      POSTGRES_DB: midespacho_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U midespacho_user']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: midespacho_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@midespacho.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
